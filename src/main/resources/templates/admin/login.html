<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Food Feedback System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="admin-login-page">

    <div class="admin-login-wrapper">
        <!-- Centered Header ABOVE Card -->
        <div class="admin-login-header text-center mb-4">
            <div class="admin-brand-icon mx-auto mb-3">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="h3 fw-bold text-dark mb-0 text-uppercase">Admin Portal</h1>
        </div>

        <!-- Centered Login Card -->
        <div class="admin-login-card">
            <h2 class="h5 fw-bold text-dark text-center mb-4">Admin Login</h2>

            <!-- Error Alert -->
            <div th:if="${loginError}" class="alert alert-danger py-2.5 px-3 rounded-3 small mb-3 d-flex align-items-center shadow-sm">
                <i class="bi bi-exclamation-circle-fill fs-5 text-danger me-2"></i>
                <span th:text="${loginError}">Invalid credentials.</span>
            </div>

            <!-- Logout Success Alert -->
            <div th:if="${logoutMessage}" class="alert alert-success py-2.5 px-3 rounded-3 small mb-3 d-flex align-items-center shadow-sm">
                <i class="bi bi-check-circle-fill fs-5 text-success me-2"></i>
                <span th:text="${logoutMessage}">Logged out successfully.</span>
            </div>

            <form th:action="@{/admin/login}" method="post" class="admin-login-form">
                <!-- Hidden CSRF token -->
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Username Field -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
                    <div class="input-group admin-login-group">
                        <span class="input-group-text bg-light border-end-0 text-muted ps-3"><i class="bi bi-person-fill"></i></span>
                        <input type="text" id="username" name="username" class="form-control admin-login-input border-start-0 ps-2" 
                               placeholder="Enter username" required autofocus autocomplete="username">
                    </div>
                </div>

                <!-- Password Field with Visibility Toggle -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                    <div class="input-group admin-login-group">
                        <span class="input-group-text bg-light border-end-0 text-muted ps-3"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="password" name="password" class="form-control admin-login-input border-start-0 border-end-0 ps-2" 
                               placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="btn btn-light border border-start-0 text-muted pe-3" id="togglePasswordBtn" title="Toggle password visibility">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn admin-login-button btn-admin-login w-100 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Dashboard
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <a th:href="@{/}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Return to Public Menu
                </a>
            </div>
        </div>
    </div>

    <!-- Script for password visibility toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            if (toggleBtn && passInput && toggleIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPass = passInput.type === 'password';
                    passInput.type = isPass ? 'text' : 'password';
                    toggleIcon.className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
                });
            }
        });
    </script>
</body>
</html>
