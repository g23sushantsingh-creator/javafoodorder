<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PlatePulse</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="admin-login-page">

    <div class="admin-login-wrapper">
        <!-- Centered Header ABOVE Card with PlatePulse Branding -->
        <div class="admin-login-header text-center mb-4">
            <a th:href="@{/}" class="admin-brand-link mb-2" title="PlatePulse Home">
                <div class="brand-logo-wrap">
                    <svg width="42" height="42" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="platepulse-logo-svg" aria-label="PlatePulse Logo">
                        <circle cx="18" cy="18" r="16" fill="url(#platePulseAdminLoginGrad)" />
                        <circle cx="18" cy="18" r="12" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-dasharray="2.5 2"/>
                        <!-- Heartbeat pulse wave over plate -->
                        <path d="M9.5 19H13.5L15.8 13.5L18.5 22.5L21 16L22.8 19H26.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Spark / Star dot -->
                        <circle cx="21.5" cy="11.5" r="1.6" fill="#FDE047"/>
                        <defs>
                            <linearGradient id="platePulseAdminLoginGrad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FF6B35"/>
                                <stop offset="1" stop-color="#EA580C"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="admin-brand-text">Plate<span class="admin-brand-accent">Pulse</span></span>
            </a>
            <p class="admin-brand-tagline mb-0">Discover &bull; Taste &bull; Rate</p>
        </div>

        <!-- Centered Login Card -->
        <div class="admin-login-card">
            <!-- Card Header -->
            <div class="text-center mb-4">
                <div class="mb-2">
                    <span class="admin-badge">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Admin Portal</span>
                    </span>
                </div>
                <h2 class="admin-card-title mb-1">Welcome Back</h2>
                <p class="admin-card-subtitle mb-0">Sign in to manage dishes, ratings, and customer feedback</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${loginError}" class="alert alert-danger py-2.5 px-3 rounded-3 small mb-3 d-flex align-items-center shadow-sm" role="alert">
                <i class="bi bi-exclamation-circle-fill fs-5 text-danger me-2 flex-shrink-0"></i>
                <span th:text="${loginError}">Invalid credentials.</span>
            </div>

            <!-- Logout Success Alert -->
            <div th:if="${logoutMessage}" class="alert alert-success py-2.5 px-3 rounded-3 small mb-3 d-flex align-items-center shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill fs-5 text-success me-2 flex-shrink-0"></i>
                <span th:text="${logoutMessage}">Logged out successfully.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/admin/login}" method="post" class="admin-login-form">
                <!-- Hidden CSRF token -->
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Username Field -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-dark mb-1.5">Username</label>
                    <div class="input-group admin-login-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" id="username" name="username" class="form-control admin-login-input"
                               placeholder="Enter username" required autofocus autocomplete="username">
                    </div>
                </div>

                <!-- Password Field with Visibility Toggle -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small text-dark mb-1.5">Password</label>
                    <div class="input-group admin-login-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="password" name="password" class="form-control admin-login-input"
                               placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="btn admin-toggle-pwd-btn" id="togglePasswordBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn admin-login-button btn-admin-login w-100 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Dashboard
                </button>
            </form>

            <div class="text-center pt-3 border-top border-light-subtle">
                <a th:href="@{/}" class="admin-back-link">
                    <i class="bi bi-arrow-left me-1.5"></i> Return to Public Menu
                </a>
            </div>
        </div>
    </div>

    <!-- Script for password visibility toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            if (toggleBtn && passInput && toggleIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPass = passInput.type === 'password';
                    passInput.type = isPass ? 'text' : 'password';
                    toggleIcon.className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
                });
            }
        });
    </script>
</body>
</html>
