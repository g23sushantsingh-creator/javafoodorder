<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="adminSidebar(activeNav)" class="admin-sidebar">
        <a th:href="@{/admin}" class="admin-sidebar-brand text-decoration-none">
            <div class="brand-logo-wrap">
                <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="platepulse-logo-svg" aria-label="PlatePulse Logo">
                    <circle cx="18" cy="18" r="16" fill="url(#platePulseSidebarGrad)" />
                    <circle cx="18" cy="18" r="12" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-dasharray="2.5 2"/>
                    <!-- Heartbeat pulse wave over plate -->
                    <path d="M9.5 19H13.5L15.8 13.5L18.5 22.5L21 16L22.8 19H26.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Spark / Star dot -->
                    <circle cx="21.5" cy="11.5" r="1.6" fill="#FDE047"/>
                    <defs>
                        <linearGradient id="platePulseSidebarGrad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FF6B35"/>
                            <stop offset="1" stop-color="#EA580C"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="d-flex flex-column">
                <span class="admin-sidebar-title">Plate<span class="brand-accent">Pulse</span></span>
                <span class="admin-sidebar-subtitle">Admin Portal</span>
            </div>
        </a>

        <ul class="admin-nav-menu">
            <li class="admin-nav-item">
                <a th:href="@{/admin}" class="admin-nav-link" th:classappend="${activeNav == 'dashboard'} ? 'active' : ''">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/foods}" class="admin-nav-link" th:classappend="${activeNav == 'foods'} ? 'active' : ''">
                    <i class="fa-solid fa-burger"></i>
                    <span>Food Items</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/feedbacks}" class="admin-nav-link" th:classappend="${activeNav == 'feedbacks'} ? 'active' : ''">
                    <i class="fa-solid fa-comments"></i>
                    <span>Customer Feedback</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/analytics}" class="admin-nav-link" th:classappend="${activeNav == 'analytics'} ? 'active' : ''">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </li>
            <li class="admin-nav-item mt-3 pt-3 border-top border-secondary border-opacity-25">
                <a th:href="@{/}" target="_blank" class="admin-nav-link text-light">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>View Public Menu</span>
                </a>
            </li>
        </ul>

        <div class="admin-sidebar-footer">
            <form th:action="@{/admin/logout}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill d-flex align-items-center justify-content-center gap-2 py-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
