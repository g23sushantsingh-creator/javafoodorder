<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Items Management - PlatePulse</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Reusable Sidebar -->
        <div th:replace="~{admin/sidebar :: adminSidebar('foods')}"></div>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Header Bar -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom border-secondary border-opacity-10 gap-3">
                <div>
                    <h2 class="fw-bold text-dark mb-1 fs-3">Food Items Management</h2>
                    <p class="text-muted mb-0 small">View, add, edit, toggle availability, and manage menu items</p>
                </div>
                <div>
                    <a th:href="@{/admin/foods/new}" class="btn btn-view-feedback px-3.5 py-2 rounded-pill shadow-sm fw-semibold d-inline-flex align-items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add New Dish</span>
                    </a>
                </div>
            </div>

            <!-- Flash Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <span th:text="${successMessage}">Success message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Food Items Table Card -->
            <div class="card border-0 shadow-sm rounded-4 bg-white">
                <div class="card-header bg-white border-0 pt-4 px-4 pb-2 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                    <h5 class="fw-bold text-dark mb-0 fs-6">
                        Menu Catalog 
                        <span class="badge bg-secondary bg-opacity-75 rounded-pill ms-1.5 px-2.5 py-1" th:text="${#lists.size(foodItems)}">24</span>
                    </h5>
                    <div class="input-group input-group-sm admin-search-group" style="max-width: 280px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="adminFoodSearch" class="form-control" placeholder="Filter dishes by name...">
                    </div>
                </div>

                <div class="card-body p-4 pt-1">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 admin-table" id="adminFoodTable">
                            <thead>
                                <tr>
                                    <th style="width: 70px;"># ID</th>
                                    <th>Dish Info</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Rating</th>
                                    <th>Availability</th>
                                    <th class="text-end" style="width: 140px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="food : ${foodItems}" class="food-table-row" th:data-name="${#strings.toLowerCase(food.name)}">
                                    <td class="text-muted fw-semibold" th:text="'#' + ${food.id}">#1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:src="${food.imageUrl != null ? food.imageUrl : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80'}" 
                                                 class="food-table-thumb" th:alt="${food.name}" onerror="this.onerror=null;this.src='/images/fallback-food.svg';">
                                            <div>
                                                <div class="fw-bold text-dark fs-6 mb-0.5" th:text="${food.name}">Food Item Name</div>
                                                <small class="text-muted text-truncate d-inline-block" style="max-width: 280px;" th:text="${food.description}">Description</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="food-category-badge" th:text="${food.category}">Category</span>
                                    </td>
                                    <td>
                                        <span class="fw-bold text-dark fs-6" th:text="'₹' + ${#numbers.formatDecimal(food.price, 1, 2)}">₹0.00</span>
                                    </td>
                                    <td>
                                        <div class="table-rating-pill">
                                            <i class="fa-solid fa-star text-warning"></i>
                                            <span th:text="${food.averageRating}">0.0</span>
                                            <small class="text-muted fw-normal" th:text="'(' + ${food.feedbackCount} + ')'">(0)</small>
                                        </div>
                                    </td>
                                    <td>
                                        <form th:action="@{'/admin/foods/toggle/' + ${food.id}}" method="post" class="d-inline">
                                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-availability"
                                                    th:classappend="${food.isAvailable() ? 'btn-availability-available' : 'btn-availability-unavailable'}"
                                                    th:title="${food.isAvailable() ? 'Click to mark Out of Stock' : 'Click to mark Available'}">
                                                <i class="fa-solid" th:classappend="${food.isAvailable() ? 'fa-check' : 'fa-xmark'}"></i>
                                                <span th:text="${food.isAvailable() ? 'Available' : 'Unavailable'}">Available</span>
                                            </button>
                                        </form>
                                    </td>
                                    <td class="text-end">
                                        <div class="d-inline-flex align-items-center gap-1.5">
                                            <a th:href="@{'/food/' + ${food.id}}" target="_blank" class="admin-action-btn admin-action-btn-view" title="View Customer Reviews">
                                                <i class="fa-solid fa-eye"></i>
                                            </a>
                                            <a th:href="@{'/admin/foods/edit/' + ${food.id}}" class="admin-action-btn admin-action-btn-edit" title="Edit Dish">
                                                <i class="fa-solid fa-pen-to-square"></i>
                                            </a>
                                            <form th:action="@{'/admin/foods/delete/' + ${food.id}}" method="post" class="d-inline"
                                                  onsubmit="return confirm('Are you sure you want to delete this food item and all its reviews? This cannot be undone.');">
                                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="admin-action-btn admin-action-btn-delete" title="Delete Dish">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple client-side table filter
        document.getElementById('adminFoodSearch')?.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.food-table-row').forEach(row => {
                const name = row.getAttribute('data-name') || '';
                row.style.display = name.includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
