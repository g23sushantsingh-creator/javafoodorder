<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Food Item - PlatePulse' : 'Add New Food Item - PlatePulse'}">Food Item Form</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Reusable Sidebar -->
        <div th:replace="~{admin/sidebar :: adminSidebar('foods')}"></div>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Header Bar -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom border-secondary border-opacity-10 gap-3">
                <div>
                    <h2 class="fs-3 fw-bold text-dark mb-1" th:text="${isEdit ? 'Edit Food Item' : 'Add New Food Item'}">Food Item Form</h2>
                    <p class="text-muted small mb-0" th:text="${isEdit ? 'Update the details below to modify this cafeteria dish.' : 'Enter the details below to add a new dish to your cafeteria menu.'}">Form description</p>
                </div>
                <a th:href="@{/admin/foods}" class="btn btn-outline-secondary rounded-pill px-3 py-2 fw-semibold d-inline-flex align-items-center gap-2" style="font-size: 0.88rem;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Food List
                </a>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger rounded-3 shadow-sm mb-4 d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${errorMessage}">Validation Error</span>
            </div>

            <!-- Two-Column Layout: Form + Preview -->
            <div class="row g-4">
                <!-- Form Card -->
                <div class="col-12 col-xl-8">
                    <div class="food-form-card">
                        <div class="food-form-card-header">
                            <h6 class="fw-bold text-dark mb-0">
                                <i class="fa-solid fa-utensils text-primary me-2"></i>Dish Information
                            </h6>
                        </div>
                        <div class="food-form-card-body">
                            <form th:action="${isEdit ? '/admin/foods/edit/' + foodForm.id : '/admin/foods/create'}"
                                  th:object="${foodForm}"
                                  method="post">

                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <!-- Dish Name -->
                                <div class="mb-4">
                                    <label for="name" class="food-form-label">Dish Name <span class="text-danger">*</span></label>
                                    <input type="text" id="name" th:field="*{name}" class="form-control food-form-input"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                           placeholder="e.g. Farmhouse Loaded Pizza">
                                    <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback" th:errors="*{name}"></div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <!-- Category -->
                                    <div class="col-md-6">
                                        <label for="category" class="food-form-label">Category <span class="text-danger">*</span></label>
                                        <select id="category" th:field="*{category}" class="form-select food-form-input"
                                                th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                            <option value="">-- Select Category --</option>
                                            <option value="Pizza &amp; Italian">Pizza &amp; Italian</option>
                                            <option value="Burgers">Burgers</option>
                                            <option value="Wraps &amp; Rolls">Wraps &amp; Rolls</option>
                                            <option value="Indian Special">Indian Special</option>
                                            <option value="Desserts">Desserts</option>
                                            <option value="Healthy">Healthy</option>
                                            <option value="Snacks &amp; Street Food">Snacks &amp; Street Food</option>
                                            <option value="Tea &amp; Beverages">Tea &amp; Beverages</option>
                                        </select>
                                        <div th:if="${#fields.hasErrors('category')}" class="invalid-feedback" th:errors="*{category}"></div>
                                    </div>

                                    <!-- Price -->
                                    <div class="col-md-6">
                                        <label for="price" class="food-form-label">Price (in ₹) <span class="text-danger">*</span></label>
                                        <div class="input-group food-form-input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" step="0.5" id="price" th:field="*{price}" class="form-control food-form-input"
                                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                                   placeholder="e.g. 199.00">
                                        </div>
                                        <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1" th:errors="*{price}"></div>
                                    </div>
                                </div>

                                <!-- Image URL -->
                                <div class="mb-4">
                                    <label for="imageUrl" class="food-form-label">Food Image URL <span class="text-danger">*</span></label>
                                    <input type="text" id="imageUrl" th:field="*{imageUrl}" class="form-control food-form-input"
                                           th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid' : ''"
                                           placeholder="https://images.unsplash.com/photo-...">
                                    <div class="form-text small mt-1" style="color: #94a3b8;">Paste a direct high-quality image URL (Unsplash or web link).</div>
                                    <div th:if="${#fields.hasErrors('imageUrl')}" class="invalid-feedback" th:errors="*{imageUrl}"></div>
                                </div>

                                <!-- Description -->
                                <div class="mb-4">
                                    <label for="description" class="food-form-label">Description <span class="text-danger">*</span></label>
                                    <textarea id="description" th:field="*{description}" rows="4" class="form-control food-form-input"
                                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                              placeholder="Describe ingredients, taste profile, and preparation style..."></textarea>
                                    <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback" th:errors="*{description}"></div>
                                </div>

                                <!-- Availability Toggle -->
                                <div class="food-form-toggle-group mb-4">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input food-form-switch" type="checkbox" role="switch" id="available" th:field="*{available}">
                                        <label class="form-check-label fw-semibold text-dark" for="available">Available in Cafeteria (In Stock)</label>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="d-flex gap-3 pt-2">
                                    <button type="submit" class="btn food-form-btn-primary px-4 py-2 rounded-pill shadow-sm">
                                        <i class="fa-solid fa-floppy-disk me-2"></i><span th:text="${isEdit ? 'Update Dish' : 'Save Dish'}">Save</span>
                                    </button>
                                    <a th:href="@{/admin/foods}" class="btn food-form-btn-cancel px-4 py-2 rounded-pill">Cancel</a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>

                <!-- Preview Panel -->
                <div class="col-12 col-xl-4">
                    <div class="food-form-card food-form-preview-card">
                        <div class="food-form-card-header">
                            <h6 class="fw-bold text-dark mb-0">
                                <i class="fa-solid fa-image text-primary me-2"></i>Live Image Preview
                            </h6>
                        </div>
                        <div class="food-form-card-body text-center">
                            <div class="food-form-preview-frame mb-3">
                                <img id="imageLivePreview"
                                     th:src="${foodForm.imageUrl != null and !foodForm.imageUrl.isEmpty() ? foodForm.imageUrl : ''}"
                                     th:style="${foodForm.imageUrl != null and !foodForm.imageUrl.isEmpty() ? '' : 'display:none;'}"
                                     class="food-form-preview-img" alt="Dish Preview">
                                <div id="imagePlaceholder"
                                     th:style="${foodForm.imageUrl != null and !foodForm.imageUrl.isEmpty() ? 'display:none;' : ''}"
                                     class="food-form-preview-placeholder">
                                    <i class="fa-solid fa-image"></i>
                                    <span>Image preview will appear here</span>
                                </div>
                            </div>
                            <p class="text-muted small mb-0">The image updates live as you type or paste the image URL.</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imgInput = document.getElementById('imageUrl');
        const imgPreview = document.getElementById('imageLivePreview');
        const imgPlaceholder = document.getElementById('imagePlaceholder');

        function updatePreview() {
            const val = imgInput.value.trim();
            if (val.startsWith('http')) {
                imgPreview.src = val;
                imgPreview.style.display = 'block';
                if (imgPlaceholder) imgPlaceholder.style.display = 'none';
            } else {
                imgPreview.style.display = 'none';
                if (imgPlaceholder) imgPlaceholder.style.display = 'flex';
            }
        }

        if (imgInput && imgPreview) {
            imgInput.addEventListener('input', updatePreview);
            imgPreview.addEventListener('error', function() {
                imgPreview.style.display = 'none';
                if (imgPlaceholder) imgPlaceholder.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
