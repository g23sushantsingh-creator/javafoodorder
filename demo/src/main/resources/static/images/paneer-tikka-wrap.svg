<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Paneer Tikka Wrap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4ec"/><stop offset="1" stop-color="#ffd9bf"/></linearGradient>
    <linearGradient id="tortilla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d7a0"/><stop offset="1" stop-color="#e2b46b"/></linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1e6dc"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="470" rx="300" ry="62" fill="#000" opacity="0.10"/>
  <ellipse cx="400" cy="430" rx="310" ry="85" fill="url(#plate)" stroke="#e9d9c9" stroke-width="4"/>
  <!-- wrap body -->
  <g transform="rotate(-14 400 300)">
    <rect x="170" y="215" width="460" height="170" rx="85" fill="url(#tortilla)" stroke="#c99a52" stroke-width="5"/>
    <!-- open end with filling -->
    <ellipse cx="205" cy="300" rx="52" ry="82" fill="#f3cf92" stroke="#c99a52" stroke-width="4"/>
    <ellipse cx="205" cy="300" rx="38" ry="66" fill="#fff3d6"/>
    <circle cx="190" cy="270" r="17" fill="#f6a24a"/><circle cx="190" cy="270" r="9" fill="#d9621c"/>
    <circle cx="214" cy="305" r="17" fill="#f6a24a"/><circle cx="214" cy="305" r="9" fill="#d9621c"/>
    <circle cx="192" cy="335" r="15" fill="#f6a24a"/><circle cx="192" cy="335" r="8" fill="#d9621c"/>
    <path d="M178 295q16-14 32 0" stroke="#7bb661" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M200 252q14 10 26 0" stroke="#b05a9b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M180 345q18 10 34 0" stroke="#7bb661" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- grill marks -->
    <g stroke="#b9792f" stroke-width="9" stroke-linecap="round" opacity="0.55">
      <path d="M300 235l-24 130"/><path d="M360 232l-24 135"/><path d="M420 232l-24 135"/><path d="M480 235l-24 130"/><path d="M540 245l-22 112"/>
    </g>
    <!-- wrapping paper band -->
    <rect x="400" y="205" width="190" height="190" rx="10" fill="#ff6b35" opacity="0.92"/>
    <path d="M400 205v190M495 205v190" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <text x="495" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" transform="rotate(90 495 300)">PANEER TIKKA</text>
  </g>
  <!-- garnish -->
  <g fill="#6aa84f"><circle cx="610" cy="440" r="14"/><circle cx="632" cy="452" r="11"/><circle cx="590" cy="455" r="10"/></g>
  <path d="M640 405q22-24 44 0q-22 14-44 0z" fill="#d9621c"/>
  <text x="400" y="560" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#c2410c">Paneer Tikka Wrap</text>
</svg>
