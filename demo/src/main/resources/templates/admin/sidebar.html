<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="adminSidebar(activeNav)" class="admin-sidebar">
        <a th:href="@{/admin}" class="admin-sidebar-brand">
            <div class="admin-brand-icon">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div>
                <h6 class="mb-0 fw-bold">Admin Portal</h6>
                <small class="text-secondary" style="font-size: 0.72rem;">Food Feedback System</small>
            </div>
        </a>

        <ul class="admin-nav-menu">
            <li class="admin-nav-item">
                <a th:href="@{/admin}" class="admin-nav-link" th:classappend="${activeNav == 'dashboard'} ? 'active' : ''">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/foods}" class="admin-nav-link" th:classappend="${activeNav == 'foods'} ? 'active' : ''">
                    <i class="fa-solid fa-burger"></i>
                    <span>Food Items</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/feedbacks}" class="admin-nav-link" th:classappend="${activeNav == 'feedbacks'} ? 'active' : ''">
                    <i class="fa-solid fa-comments"></i>
                    <span>Customer Feedback</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/analytics}" class="admin-nav-link" th:classappend="${activeNav == 'analytics'} ? 'active' : ''">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </li>
            <li class="admin-nav-item mt-3 pt-3 border-top border-secondary border-opacity-25">
                <a th:href="@{/}" target="_blank" class="admin-nav-link text-light">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>View Public Menu</span>
                </a>
            </li>
        </ul>

        <div class="admin-sidebar-footer">
            <form th:action="@{/admin/logout}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill d-flex align-items-center justify-content-center gap-2 py-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
