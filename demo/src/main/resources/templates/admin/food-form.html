<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Dish - Admin Portal' : 'Add New Dish - Admin Portal'}">Food Item Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Reusable Sidebar -->
        <div th:replace="~{admin/sidebar :: adminSidebar('foods')}"></div>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Header Bar -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${isEdit ? 'Edit Food Item' : 'Add New Food Item'}">Food Item Form</h2>
                    <p class="text-muted mb-0">Fill in the details below to update or register the cafeteria dish</p>
                </div>
                <a th:href="@{/admin/foods}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Food List
                </a>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger rounded-3 shadow-sm mb-4">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${errorMessage}">Validation Error</span>
            </div>

            <!-- Form Card -->
            <div class="row">
                <div class="col-12 col-xl-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <form th:action="${isEdit ? '/admin/foods/edit/' + foodForm.id : '/admin/foods/create'}" 
                              th:object="${foodForm}" 
                              method="post">

                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <!-- Dish Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Dish Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="e.g. Farmhouse Loaded Pizza">
                                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback" th:errors="*{name}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <!-- Category -->
                                <div class="col-md-6">
                                    <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                    <select id="category" th:field="*{category}" class="form-select"
                                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                        <option value="">-- Select Category --</option>
                                        <option value="Pizza & Italian">Pizza & Italian</option>
                                        <option value="Burgers">Burgers</option>
                                        <option value="Wraps & Rolls">Wraps & Rolls</option>
                                        <option value="Indian Special">Indian Special</option>
                                        <option value="Desserts">Desserts</option>
                                        <option value="Healthy">Healthy</option>
                                        <option value="Snacks & Street Food">Snacks & Street Food</option>
                                        <option value="Tea & Beverages">Tea & Beverages</option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('category')}" class="invalid-feedback" th:errors="*{category}"></div>
                                </div>

                                <!-- Price -->
                                <div class="col-md-6">
                                    <label for="price" class="form-label fw-semibold">Price (in ₹) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light fw-bold">₹</span>
                                        <input type="number" step="0.5" id="price" th:field="*{price}" class="form-control"
                                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                               placeholder="e.g. 199.00">
                                    </div>
                                    <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1" th:errors="*{price}"></div>
                                </div>
                            </div>

                            <!-- Image URL -->
                            <div class="mb-3">
                                <label for="imageUrl" class="form-label fw-semibold">Food Image URL <span class="text-danger">*</span></label>
                                <input type="text" id="imageUrl" th:field="*{imageUrl}" class="form-control"
                                       th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid' : ''"
                                       placeholder="https://images.unsplash.com/photo-...">
                                <div class="form-text">Paste a direct high-quality image URL (Unsplash or web link).</div>
                                <div th:if="${#fields.hasErrors('imageUrl')}" class="invalid-feedback" th:errors="*{imageUrl}"></div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                                <textarea id="description" th:field="*{description}" rows="3" class="form-control"
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                          placeholder="Describe ingredients, taste profile, and preparation style..."></textarea>
                                <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback" th:errors="*{description}"></div>
                            </div>

                            <!-- Availability Switch -->
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" role="switch" id="available" th:field="*{available}">
                                <label class="form-check-label fw-semibold" for="available">Available in Cafeteria (In Stock)</label>
                            </div>

                            <!-- Actions -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-view-feedback px-4 py-2 rounded-pill shadow-sm">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> <span th:text="${isEdit ? 'Update Dish' : 'Save Dish'}">Save</span>
                                </button>
                                <a th:href="@{/admin/foods}" class="btn btn-light px-4 py-2 rounded-pill border">Cancel</a>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Preview Panel -->
                <div class="col-12 col-xl-4 mt-4 mt-xl-0">
                    <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
                        <h6 class="fw-bold text-dark mb-3">Live Image Preview</h6>
                        <div class="rounded-3 overflow-hidden bg-light border mb-3" style="height: 200px;">
                            <img id="imageLivePreview" 
                                 th:src="${foodForm.imageUrl != null and !foodForm.imageUrl.isEmpty() ? foodForm.imageUrl : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80'}" 
                                 class="w-100 h-100" style="object-fit: cover;" alt="Dish Preview">
                        </div>
                        <p class="text-muted small mb-0">The image will update live as you type or paste the image URL.</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imgInput = document.getElementById('imageUrl');
        const imgPreview = document.getElementById('imageLivePreview');
        if (imgInput && imgPreview) {
            imgInput.addEventListener('input', () => {
                const val = imgInput.value.trim();
                if (val.startsWith('http')) {
                    imgPreview.src = val;
                }
            });
        }
    </script>
</body>
</html>
